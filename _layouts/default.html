<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
  </head>
  <body>

    <header class="site-header">
      <div class="wrap">
        <h1 class="site-title"><a href="{{ site.baseurl }}/">{{ site.title | default: "Maria Rodriguez" }}</a></h1>
        <nav class="site-nav">
          <a href="{{ site.baseurl }}/">Home</a>
          <a href="{{ site.baseurl }}/projects/">Projects</a>
          <a href="{{ site.baseurl }}/blog/">Blog</a>
          <a href="{{ site.baseurl }}/archive/">Archive</a>
        </nav>
      </div>
    </header>

    <main>{{ content }}</main>

    <footer class="site-footer">
      <div class="wrap">&copy; {{ "now" | date: "%Y" }} Maria Rodriguez &mdash; built on GitHub Pages</div>
    </footer>

    <script src="{{ site.baseurl }}/assets/js/projects-filter.js" defer></script>
    <script src="{{ site.baseurl }}/assets/js/gallery-lightbox.js" defer></script>
  </body>
</html>
