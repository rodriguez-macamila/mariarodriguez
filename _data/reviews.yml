# Client reviews/testimonials shown in the "Reviews" section on the homepage.
#
# To add a review, add an entry in this shape:
#
# - text: "Maria delivered exactly what we needed, on time and beautifully presented."
#   name: "Jane Doe"
#   company: "Example Studio"
#   year: "2026"
#   rating: 5
#
# Fields:
#   text     required — the quote itself, no quotation marks needed, they're added automatically
#   name     required — client's name
#   company  optional — shown after the name
#   year     optional — shown after the company
#   rating   optional — number of filled stars, 1-5. Defaults to 5 if left out.
#
# IMPORTANT: name/company/year/rating must be indented 2 spaces so they line
# up under "text" — that indentation is what tells YAML they belong to the
# same review. Without it, YAML reads them as separate items and the file
# fails to parse (this is what happened before).

- text: "I highly recommend Maria. She’s supported me on 100+ projects, producing everything from interior/exterior renderings to site plans, aerials, and master-planned community visuals. She turns rough ideas into polished, professional work quickly, understands real estate, and is incredibly reliable. Her talent consistently elevates every project."
  name: "Kyle S."
  company: "Glaser Retail Partners"
  year: "2025"
  rating: 5

